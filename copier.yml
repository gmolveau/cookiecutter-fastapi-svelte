_subdirectory: template
_templates_suffix: ""
_answers_file: .copier-answers.yml
_envops:
  block_start_string: "<%"
  block_end_string: "%>"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "<#"
  comment_end_string: "#>"

_tasks:
  - command: uv sync
    working_directory: backend
  - command: just install-dev
    working_directory: frontend
  - just init-env

project_name:
  type: str
  help: Human-readable project name
  default: My App

project_slug:
  type: str
  help: Project slug (directory names, docker image names)
  default: "{{ project_name | lower | replace(' ', '-') }}"

python_package_name:
  type: str
  help: Python package name (used in pyproject.toml)
  default: "{{ project_slug | replace('-', '') }}"

description:
  type: str
  help: Short project description
  default: A fullstack web application

author_name:
  type: str
  help: Author name
  default: Your Name

github_username:
  type: str
  help: GitHub username (for image registry)
  default: your-username
