_subdirectory: template
_templates_suffix: ""
_answers_file: .copier-answers.yml
_message_after_copy: |
  Your project [[ project_name ]] is ready!

  Next steps:
    cd [[ _copier_conf.dst_path ]]
    just init-env
    (cd backend && uv sync)
    (cd frontend && just install-dev)
_envops:
  block_start_string: "<%"
  block_end_string: "%>"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "<#"
  comment_end_string: "#>"

project_name:
  type: str
  help: Human-readable project name
  default: My App

project_slug:
  type: str
  help: Project slug (directory names, docker image names)
  default: "[[ project_name | lower | replace(' ', '-') ]]"

python_package_name:
  type: str
  help: Python package name (used in pyproject.toml)
  default: "[[ project_slug | replace('-', '') ]]"

description:
  type: str
  help: Short project description
  default: A fullstack web application

author_name:
  type: str
  help: Author name
  default: Your Name

github_username:
  type: str
  help: GitHub username (for image registry)
  default: your-username
